<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMEMS - لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <div class="sidebar-brand">
                    <h2>SMEMS</h2>
                    <span>إدارة المعدات الطبية</span>
                </div>
            </div>
            
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Nav items will be generated by JS based on role -->
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="sidebarUserAvatar">م</div>
                    <div class="user-details">
                        <h4 id="sidebarUserName">اسم المستخدم</h4>
                        <span id="sidebarUserRole">القسم</span>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-right">
                    <button class="menu-toggle" id="menuToggle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" x2="20" y1="12" y2="12"/>
                            <line x1="4" x2="20" y1="6" y2="6"/>
                            <line x1="4" x2="20" y1="18" y2="18"/>
                        </svg>
                    </button>
                    <div class="header-info">
                        <h1>لوحة التحكم</h1>
                        <p id="currentDate"></p>
                    </div>
                </div>
                
                <div class="header-left">
                    <!-- Notifications -->
                    <div class="notifications-wrapper">
                        <button class="btn btn-ghost btn-icon notification-btn" id="notificationBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                            </svg>
                            <span class="notification-badge" id="notificationBadge">0</span>
                        </button>
                        
                        <div class="notifications-dropdown" id="notificationsDropdown">
                            <div class="notifications-header">
                                <h3>الإشعارات</h3>
                                <button class="btn btn-ghost btn-sm" onclick="markAllNotificationsRead()">تحديد الكل كمقروء</button>
                            </div>
                            <div class="notifications-list" id="notificationsList">
                                <!-- Notifications loaded by JS -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- User Dropdown -->
                    <div class="user-dropdown">
                        <div class="header-user" id="userDropdownBtn">
                            <div class="header-user-info">
                                <h4 id="userName">اسم المستخدم</h4>
                                <span id="userRole">الدور</span>
                            </div>
                            <div class="header-user-avatar" id="userAvatar">م</div>
                        </div>
                        
                        <div class="user-dropdown-menu" id="userDropdownMenu">
                            <div class="dropdown-item" onclick="logout()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                تسجيل الخروج
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Page Content -->
            <div class="page-content" id="pageContent">
                <!-- Dashboard content will be loaded here based on role -->
            </div>
        </main>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script src="data.js"></script>
    <script src="apiService.js"></script>
    <script src="script.js"></script>
    <script>
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!AuthAPI.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            
            // Initialize
            initDashboard();
        });

        // Set current date
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-SA', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    </script>
</body>
</html>
